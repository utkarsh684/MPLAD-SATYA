name: mplad_satya
description: "MPLAD SATYA - Evidence-Driven Risk Intelligence for MPLADS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^15.1.2
  provider: ^6.1.5
  google_fonts: ^6.2.1
  fl_chart: ^1.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_staggered_animations: ^1.1.1
  animated_text_kit: ^4.2.3
  percent_indicator: ^4.2.5
  # --- backend integration ---
  http: ^1.2.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Official mark. The largest on-screen use is the 148 pt splash, which
    # needs 444 px even on a 3x display, so a single 512 px asset covers
    # every density without shipping a second megabyte in the APK.
    - assets/logo.png
