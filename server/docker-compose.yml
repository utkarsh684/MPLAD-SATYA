services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: satya
      POSTGRES_PASSWORD: satya
      POSTGRES_DB: satya
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satya -d satya"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
