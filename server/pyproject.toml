[project]
name = "mplad-satya-server"
version = "0.1.0"
description = "MPLAD SATYA — evidence-based audit backend for MPLADS public works"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "geoalchemy2==0.15.2",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "pyjwt[crypto]==2.10.1",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.2.1",
  "python-multipart==0.0.19",
  "pillow==10.4.0",
  "imagehash==4.3.1",
  "piexif==1.1.3",
  "opencv-python-headless==4.10.0.84",
  "scikit-learn==1.5.2",
  "numpy==2.1.3",
  "simpleeval==1.0.3",
  "httpx==0.27.2",
  "orjson==3.10.12",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
